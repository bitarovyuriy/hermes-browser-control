<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hermes CDP fixture</title>
    <style>
      body { font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; margin: 16px; }
      #box { margin-top: 12px; padding: 8px; border: 1px solid #ccc; }
      button, input { font: inherit; }
    </style>
  </head>
  <body>
    <h1 id="heading">Hermes fixture</h1>
    <button id="inc">increment</button>
    <span id="count">0</span>
    <button id="fetch">fetch data</button>
    <div id="data">no data</div>
    <input id="name" placeholder="name" />
    <a id="link" href="/page2">page two</a>
    <div id="box">box</div>
    <script>
      let n = 0;
      const count = document.getElementById('count');
      document.getElementById('inc').addEventListener('click', () => {
        n += 1;
        count.textContent = String(n);
        console.log('HERMES_E2E_CLICK ' + n);
      });
      document.getElementById('fetch').addEventListener('click', async () => {
        const response = await fetch('/data.json');
        const payload = await response.json();
        document.getElementById('data').textContent = payload.value;
        console.log('HERMES_E2E_FETCH ' + payload.value);
      });
    </script>
  </body>
</html>
